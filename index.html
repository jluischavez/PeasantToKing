<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c211d" />
    <title>Peasant to King</title>
  </head>
  <body>
    <main id="game" aria-label="Peasant to King — Mapa inicial de 20 por 20 casillas"></main>
    <footer id="controls">
      <nav id="construction-menu" aria-label="Construcción">
        <div class="construction-buttons">
          <button type="button" data-construction="cancel" disabled>Cancelar construcción</button>
        </div>
        <p id="construction-status" aria-live="polite">Selecciona un tipo de construcción.</p>
      </nav>
      <section id="selection-panel" aria-label="Información de la casilla">
        <div aria-live="polite" aria-atomic="true">
          <p>Coordenadas (0–19): <span id="cell-coordinates">X: — · Y: —</span></p>
          <p>Tipo de terreno: <span id="cell-terrain">—</span></p>
          <p>Estado: <span id="cell-status">Sin selección</span></p>
        </div>
        <button id="cancel-selection" type="button" disabled>Cancelar selección</button>
      </section>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
